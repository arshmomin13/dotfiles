[buildPlans.Menevka]
family = "Menevka"
spacing = "normal"
serifs = "sans"
noCvSs = false
exportGlyphNames = false
noLigation = true

  [buildPlans.Menevka.variants]
  inherits = "ss04"

[buildPlans.Menevka.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.Menevka.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.Menevka.widths.Condensed]
shape = 500
menu = 3
css = "condensed"

[buildPlans.Menevka.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.Menevka.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.Menevka.slopes.Oblique]
angle = 9.4
shape = "oblique"
menu = "oblique"
css = "oblique"
